name: Webhook Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Debug
        run: |
          echo "Raw length: $(echo -n "${{ secrets.DISCORD_WEBHOOK }}" | wc -c)"
          echo "Stripped length: $(echo -n "${{ secrets.DISCORD_WEBHOOK }}" | tr -d '\n' | wc -c)"

      - name: Send
        run: |
          python3 << 'EOF'
          import os, json, urllib.request

          url = os.environ["DISCORD_WEBHOOK"].strip()
          data = json.dumps({"content": "test"}).encode()
          req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
          urllib.request.urlopen(req)
          print("Success")
          EOF
