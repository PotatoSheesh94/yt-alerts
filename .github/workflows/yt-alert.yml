name: YouTube to Discord

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Poll RSS and notify Discord
        env:
          CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          CHANNEL_NAME: ${{ secrets.YT_CHANNEL_NAME }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 << 'EOF'
          import json, os, urllib.request, xml.etree.ElementTree as ET

          ch    = os.environ['CHANNEL_ID']
          cname = os.environ['CHANNEL_NAME']
          wh    = os.environ['WEBHOOK']
          sf    = 'seen.json'
          ns    = {'a':'http://www.w3.org/2005/Atom',
                   'yt':'http://www.youtube.com/xml/schemas/2015',
                   'm':'http://search.yahoo.com/mrss/'}
          url   = f'https://www.youtube.com/feeds/videos.xml?channel_id={ch}'

          root = ET.fromstring(urllib.request.urlopen(url, timeout=20).read())
          seen = set(json.load(open(sf))) if os.path.exists(sf) else set()
          first = not seen

          for e in reversed(root.findall('a:entry', ns)):
              vid   = e.findtext('yt:videoId', namespaces=ns)
              title = e.findtext('a:title', namespaces=ns) or 'New video'
              link  = e.find('a:link', ns).get('href')

              if vid in seen:
                  continue
              seen.add(vid)

              if first:
                  continue

              status = e.find('m:status', ns)
              is_live = False
              if status is not None:
                  for attr, val in status.attrib.items():
                      if val == 'streaming':
                          is_live = True

              if is_live:
                  content = (f"📢 <@&1549756171622158516> {cname} is LIVE on YouTube! "
                             f"Go check it out 👇\n{link}")
              else:
                  content = (f"📢 <@&1549756171622158516> {cname} just posted something "
                             f"new on YouTube! Go check it out 👇\n{link}")

              body = json.dumps({'username': 'YouTube Alerts',
                                 'content': content}).encode()
              req = urllib.request.Request(wh, body,
                      {'Content-Type': 'application/json'})
              urllib.request.urlopen(req, timeout=15)
              label = "LIVE" if is_live else "Upload"
              print(f'Posted ({label}): {title}')

          json.dump(list(seen)[-500:], open(sf, 'w'))
          EOF
