name: YouTube to Discord

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Write script
        run: |
          cat > poll.py << 'SCRIPT'
          import json, os, urllib.request

          pl    = os.environ['PLAYLIST_ID']
          cname = os.environ['CHANNEL_NAME']
          wh    = os.environ['WEBHOOK'].strip()
          key   = os.environ['YT_API_KEY']
          sf    = 'seen.json'

          # --- DEBUG: test message ---
          test_body = json.dumps({'username': 'YouTube Alerts',
                                  'content': '✅ Test: workflow is running.'}).encode()
          test_req = urllib.request.Request(wh, test_body,
                  {'Content-Type': 'application/json',
                   'User-Agent': 'YouTubeAlerts/1.0 (github-actions)'})
          urllib.request.urlopen(test_req, timeout=15)
          print('Test message sent.')
          # --- END DEBUG ---

          url = (f'https://www.googleapis.com/youtube/v3/playlistItems'
                 f'?part=snippet&playlistId={pl}&maxResults=5&key={key}')

          req = urllib.request.Request(url, headers={
              'User-Agent': 'YouTubeAlerts/1.0 (github-actions)'
          })
          data = json.loads(urllib.request.urlopen(req, timeout=20).read())

          seen = set(json.load(open(sf))) if os.path.exists(sf) else set()
          first = not seen

          for item in data.get('items', []):
              vid   = item['snippet']['resourceId']['videoId']
              title = item['snippet']['title']
              link  = f'https://www.youtube.com/watch?v={vid}'

              if vid in seen:
                  continue
              seen.add(vid)

              if first:
                  continue

              content = (f"📢 <@&1549756171622158516> {cname} just posted something "
                         f"new on YouTube! Go check it out 👇\n{link}")

              body = json.dumps({'username': 'YouTube Alerts',
                                 'content': content}).encode()
              wh_req = urllib.request.Request(wh, body,
                      {'Content-Type': 'application/json',
                       'User-Agent': 'YouTubeAlerts/1.0 (github-actions)'})
              urllib.request.urlopen(wh_req, timeout=15)
              print(f'Posted: {title}')

          json.dump(list(seen)[-500:], open(sf, 'w'))
          SCRIPT

      - name: Run
        env:
          PLAYLIST_ID: UU8q4duHu0446CUUsUUjgZGw
          CHANNEL_NAME: ${{ secrets.YT_CHANNEL_NAME }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          python3 poll.py
